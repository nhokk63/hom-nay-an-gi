<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<title>Hôm Nay Ăn Gì?</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{margin:0;font-family:-apple-system,'Be Vietnam Pro','SF Pro Text',Roboto,sans-serif;background:#111;color:#fff;
  max-width:480px;margin:0 auto;position:relative;-webkit-font-smoothing:antialiased}
svg.ic{width:18px;height:18px;flex:0 0 auto}
#stage{position:fixed;inset:0;max-width:480px;margin:0 auto;perspective:1800px;overflow:hidden;background:#111;touch-action:none}
.page{position:absolute;inset:0;background-size:cover;background-position:center;will-change:transform}
#pageUnder{z-index:1}
#pageTop{z-index:2;transform-origin:left center;box-shadow:0 0 60px rgba(0,0,0,.5)}
#pageTop::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;
  background:linear-gradient(105deg,transparent 40%,rgba(0,0,0,.45) 100%)}
#pageTop.flipping::after{opacity:1}
#pageTop.flipL{transform:rotateY(-168deg);transition:transform .62s cubic-bezier(.35,.05,.25,1)}
#pageTop.flipR{transform-origin:right center;transform:rotateY(168deg);transition:transform .62s cubic-bezier(.35,.05,.25,1)}
#pageTop.flipU{transform-origin:center top;transform:rotateX(-168deg);transition:transform .62s cubic-bezier(.35,.05,.25,1)}
#pageTop.flipD{transform-origin:center bottom;transform:rotateX(168deg);transition:transform .62s cubic-bezier(.35,.05,.25,1)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.32) 0%,transparent 28%,transparent 52%,rgba(0,0,0,.55) 76%,rgba(0,0,0,.88) 100%);pointer-events:none}
/* ---- dish content ---- */
.ptxt{position:absolute;left:0;right:0;bottom:0;padding:24px 26px 88px;pointer-events:none}
.ptxt>*{pointer-events:auto}
.overline{font-size:11px;font-weight:700;letter-spacing:3px;color:rgba(255,255,255,.72);margin-bottom:10px;text-transform:uppercase}
.overline b{color:#fff}
.ptxt h1{font-size:40px;margin:0 0 6px;font-weight:800;letter-spacing:-.8px;line-height:1.12;text-shadow:0 2px 16px rgba(0,0,0,.45)}
.ptxt .desc{margin:0 0 12px;font-size:15px;line-height:1.5;color:rgba(255,255,255,.85)}
.metaRow{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:rgba(255,255,255,.8);margin-bottom:18px}
.metaRow svg.ic{width:15px;height:15px;opacity:.85}
.metaRow .dot{opacity:.4}
.ctaRow{display:flex}
.cta{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;border:0;cursor:pointer;
  background:#fff;color:#1c1a17;font-size:15px;font-weight:700;box-shadow:0 12px 28px rgba(0,0,0,.35)}
.cta svg.ic{width:17px;height:17px}
.cta:active{transform:scale(.96)}
/* ---- top bar ---- */
#topbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0;pointer-events:none}
#topbar>*{pointer-events:auto}
#brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800;letter-spacing:-.3px;text-shadow:0 2px 8px rgba(0,0,0,.5);white-space:nowrap}
#brand .logo{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
  backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center}
#brand .logo svg{width:19px;height:19px}
#topActions{display:flex;align-items:center;gap:10px}
#mealSeg{display:flex;background:rgba(20,18,16,.42);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(12px);
  border-radius:999px;padding:3px}
#mealSeg button{display:flex;align-items:center;gap:6px;border:0;background:transparent;color:rgba(255,255,255,.75);
  font-size:13px;font-weight:700;padding:7px 13px;border-radius:999px;cursor:pointer}
#mealSeg button svg{width:14px;height:14px}
#mealSeg button.on{background:#fff;color:#1c1a17}
#bellBtn{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);cursor:pointer;color:#fff;
  background:rgba(20,18,16,.42);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center}
#bellBtn svg{width:18px;height:18px}
/* ---- bottom meta ---- */
#counter{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);right:22px;z-index:5;
  font-size:11px;font-weight:700;letter-spacing:1.5px;color:rgba(255,255,255,.65)}
#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:22px;z-index:5;
  font-size:11px;font-weight:600;letter-spacing:1.2px;color:rgba(255,255,255,.65);transition:opacity 1s;text-transform:uppercase}
/* ---- notification sheet ---- */
#sheetWrap{position:fixed;inset:0;z-index:20;pointer-events:none}
#sheetWrap.open{pointer-events:auto}
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .35s}
#sheetWrap.open #scrim{opacity:1}
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#191715;color:#f5efe6;
  border-radius:26px 26px 0 0;padding:14px 22px calc(env(safe-area-inset-bottom,0px) + 26px);
  transform:translateY(105%);transition:transform .38s cubic-bezier(.32,.9,.35,1)}
#sheetWrap.open #sheet{transform:none}
#grab{width:44px;height:5px;border-radius:99px;background:rgba(255,255,255,.22);margin:0 auto 16px}
#sheet h2{font-size:18px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
#sheet h2 svg{width:20px;height:20px}
.nrow{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.nrow:last-of-type{border-bottom:0}
.nrow .tt{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.nrow .tt svg{width:17px;height:17px;opacity:.85}
.nrow .s{font-size:12px;color:rgba(245,239,230,.55);margin-top:3px}
.switch{width:52px;height:30px;border-radius:999px;background:rgba(255,255,255,.16);position:relative;transition:background .25s;flex:0 0 auto;cursor:pointer}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .25s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.switch.on{background:#E8590C}
.switch.on::after{left:25px}
#btnTest{width:100%;margin-top:14px;padding:14px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;
  background:transparent;color:#f5efe6;border:1px solid rgba(255,255,255,.25)}
/* ---- recipe sheet ---- */
#recipeWrap{position:fixed;inset:0;z-index:30;display:none}
#recipeWrap.open{display:block}
#rScrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#rSheet{position:absolute;left:0;right:0;bottom:0;top:7%;max-width:480px;margin:0 auto;background:#FBF8F3;
  border-radius:28px 28px 0 0;overflow:hidden;display:flex;flex-direction:column;
  animation:sheetUp .4s cubic-bezier(.32,.9,.35,1)}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
#rHead{position:relative;height:200px;flex:0 0 auto;background-size:cover;background-position:center}
#rHead::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,transparent 40%,rgba(0,0,0,.72) 100%)}
#rClose{position:absolute;top:14px;right:14px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(0,0,0,.45);color:#fff;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
#rClose svg{width:16px;height:16px}
#rTitle{position:absolute;bottom:16px;left:22px;right:22px;z-index:1;color:#fff}
#rTitle .overline{color:rgba(255,255,255,.75);margin-bottom:6px}
#rTitle h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px}
#rBody{overflow-y:auto;padding:22px;-webkit-overflow-scrolling:touch}
.secHead{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.secHead .badge{width:34px;height:34px;border-radius:12px;background:#E8590C;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.secHead .badge svg{width:17px;height:17px;stroke:#fff}
.secHead h3{font-size:17px;margin:0;color:#241c14;font-weight:800}
.secHead .cnt{margin-left:auto;font-size:12px;font-weight:700;color:#a08b70}
.ingGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px}
.ing{background:#fff;border:1px solid #f1e7d6;border-radius:18px;padding:14px 6px 12px;text-align:center;box-shadow:0 4px 14px rgba(120,70,20,.05)}
.ing .ic{width:48px;height:48px;border-radius:50%;background:#FDF1E3;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 8px}
.ing .nm{font-size:12px;font-weight:700;color:#241c14;line-height:1.35}
.ing .qt{font-size:11px;color:#a08b70;margin-top:3px}
.step{display:flex;gap:14px;margin-bottom:6px;padding:12px 0;border-bottom:1px solid #f1e7d6}
.step:last-child{border-bottom:0}
.step .num{flex:0 0 32px;width:32px;height:32px;border-radius:50%;background:#241c14;
  color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.step .tx{font-size:14.5px;color:#4a3d30;line-height:1.65;padding-top:5px}

.comboRow{display:flex;gap:10px;margin:2px 0 16px;overflow-x:auto;scrollbar-width:none}
.comboRow::-webkit-scrollbar{display:none}
.comboCard{flex:0 0 auto;width:118px;cursor:pointer;opacity:.75;transition:opacity .2s}
.comboCard.on{opacity:1}
.comboCard img{width:118px;height:74px;object-fit:cover;border-radius:14px;display:block;border:2px solid transparent}
.comboCard.on img{border-color:#fff}
.comboCard span{display:block;font-size:11px;font-weight:700;margin-top:6px;line-height:1.35;color:rgba(255,255,255,.92);text-shadow:0 1px 4px rgba(0,0,0,.5)}
.comboLabel{font-size:11px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.65);margin-bottom:8px;text-transform:uppercase}
</style>
</head>

</div>

const $=id=>document.getElementById(id);
const seedOf=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;};
const todayKey=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();};
// ---- meal engine: each meal = 2-3 dishes ----
function sShuffle(arr,salt){const a=[...arr];const rnd=seedOf(salt);
  for(let i=a.length-1;i>0;i--){const j=(rnd+i*2654435761)%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const byCat=c=>DISHES.map((d,i)=>d[1]===c?i:-1).filter(i=>i>=0);
function buildMeals(){
  const K=todayKey();
  const mans=sShuffle(byCat("man"),K+"man"),canhs=sShuffle(byCat("canh"),K+"canh"),
        phus=sShuffle(byCat("phu"),K+"phu"),nuocs=sShuffle(byCat("nuoc"),K+"nuoc"),
        chays=sShuffle(byCat("chay"),K+"chay");
  const meals=[];let mi=0,ci=0,pi=0,ni=0,hi=0;
  for(let m=0;m<14;m++){
    const r=(seedOf(K+"type"+m)%100)/100;
    if(r<0.62&&mans.length&&canhs.length&&phus.length){
      meals.push({type:"com",dishes:[mans[mi++%mans.length],canhs[ci++%canhs.length],phus[pi++%phus.length]]});
    }else if(r<0.84&&nuocs.length){
      meals.push({type:"nuoc",dishes:[nuocs[ni++%nuocs.length]]});
    }else if(chays.length){
      const a=chays[hi++%chays.length];let b=chays[hi++%chays.length];
      if(b===a)b=chays[hi++%chays.length];
      meals.push({type:"chay",dishes:[a,b]});
    }
  }
  return meals;
}
const MEALTYPE={com:"Bữa cơm",nuoc:"Bữa nước",chay:"Bữa chay"};
let meals=buildMeals();
let mealIdx=0, heroIdx=0, meal="trua", flipping=false, hintShown=false;
function mealByTime(){const h=new Date().getHours();return (h>=5&&h<15)?"trua":"toi";}
function curMeal(){return meals[((mealIdx%meals.length)+meals.length)%meals.length];}
function curDishIdx(){const m=curMeal();return m.dishes[heroIdx%m.dishes.length];}

function renderPage(el,mealObj,hIdx){
  const di=mealObj.dishes[hIdx%mealObj.dishes.length], d=DISHES[di];
  el.style.backgroundImage=`url('${IMG[d[0]]||""}')`;
  const n=mealObj.dishes.length;
  let combo="";
  if(n>1){
    combo=`<div class="comboLabel">Bữa này gồm ${n} món</div><div class="comboRow">`+
      mealObj.dishes.map((x,i)=>{const dd=DISHES[x];
        return `<div class="comboCard${i===hIdx?" on":""}" onclick="setHero(${i})"><img src="${IMG[dd[0]]||""}" alt=""><span>${dd[0]}</span></div>`;
      }).join("")+`</div>`;
  }
  el.innerHTML=`<div class="shade"></div><div class="ptxt">
    <div class="overline">${MEALN[meal]} &nbsp;·&nbsp; <b>${MEALTYPE[mealObj.type].toUpperCase()}</b>${n>1?" &nbsp;·&nbsp; "+n+" MÓN":""}</div>
    <h1>${d[0]}</h1>
    <p class="desc">${d[2]}</p>
    ${combo}
    <div class="metaRow">${I.clock}<span>${d[3]}</span><span class="dot">·</span>${I.flame}<span>${difficulty(d[3])}</span></div>
    <div class="ctaRow"><button class="cta" onclick="openRecipe()">Xem cách nấu ${I.arrow}</button></div>
  </div>`;
}
function setHero(i){heroIdx=i;renderPage($("pageTop"),curMeal(),heroIdx);}
function renderAll(){
  const m=curMeal(), total=meals.length, cur=((mealIdx%total)+total)%total+1;
  renderPage($("pageTop"),m,heroIdx);
  const nm=meals[(((mealIdx+1)%total)+total)%total];
  renderPage($("pageUnder"),nm,0);
  $("counter").textContent=String(cur).padStart(2,"0")+" / "+total;
  document.querySelectorAll("#mealSeg button").forEach(b=>b.classList.toggle("on",b.dataset.m===meal));
}
function flip(dir){
  if(flipping)return; flipping=true;
  const top=$("pageTop");
  const delta=(dir==="L"||dir==="U")?1:-1;
  const total=meals.length;
  const tm=meals[(((mealIdx+delta)%total)+total)%total];
  renderPage($("pageUnder"),tm,0);
  const cls={L:"flipL",R:"flipR",U:"flipU",D:"flipD"}[dir];
  // force reflow then animate
  top.classList.remove("flipL","flipR","flipU","flipD"); void top.offsetWidth;
  requestAnimationFrame(()=>top.classList.add(cls));
  setTimeout(()=>{
    mealIdx+=delta; heroIdx=0;
    renderAll();
    top.classList.remove(cls);
    flipping=false;
    if(!hintShown){hintShown=true;$("hint").style.opacity="0";}
  },640);
}
// swipe
(function(){
  const st=$("stage");let x0=0,y0=0;
  st.addEventListener("touchstart",e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;},{passive:true});
  st.addEventListener("touchend",e=>{
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)<40&&Math.abs(dy)<40)return;
    if(Math.abs(dx)>Math.abs(dy)) flip(dx<0?"L":"R"); else flip(dy<0?"U":"D");
  },{passive:true});
  // mouse for desktop
  let mx0=0,my0=0,down=false;
  st.addEventListener("mousedown",e=>{down=true;mx0=e.clientX;my0=e.clientY;});
  st.addEventListener("mouseup",e=>{if(!down)return;down=false;
    const dx=e.clientX-mx0,dy=e.clientY-my0;
    if(Math.abs(dx)<40&&Math.abs(dy)<40)return;
    if(Math.abs(dx)>Math.abs(dy)) flip(dx<0?"L":"R"); else flip(dy<0?"U":"D");
  });
})();
// meal segmented control: jump to daily dish of that meal
document.querySelectorAll("#mealSeg button").forEach(b=>b.onclick=()=>{
  meal=b.dataset.m;
  mealIdx=(meal==="trua")?0:1; heroIdx=0;
  renderAll();
});
// sheet
const wrap=$("sheetWrap");
$("bellBtn").onclick=()=>wrap.classList.add("open");
$("scrim").onclick=()=>wrap.classList.remove("open");
// notifications
const timers={};
async function ensurePerm(){
  if(!("Notification" in window))return false;
  if(Notification.permission==="default")await Notification.requestPermission();
  return Notification.permission==="granted";
}
function scheduleMeal(key,hour,title){
  clearTimeout(timers[key]);
  const now=new Date(),t=new Date();t.setHours(hour,0,0,0);
  if(t<=now)t.setDate(t.getDate()+1);
  timers[key]=setTimeout(()=>{
    const m=meals[(key==="trua")?0:1]||meals[0];
    const names=m.dishes.map(x=>DISHES[x][0]).join(", ");
    try{new Notification(title,{body:"Hôm nay: "+names});}catch(e){}
    scheduleMeal(key,hour,title);
  },t-now);
}
function bindSwitch(id,key,hour,title){
  const el=$(id), saved=localStorage.getItem("hag_n_"+key)==="1";
  if(saved){el.classList.add("on");scheduleMeal(key,hour,title);}
  el.onclick=async()=>{
    if(el.classList.contains("on")){el.classList.remove("on");clearTimeout(timers[key]);localStorage.setItem("hag_n_"+key,"0");}
    else if(await ensurePerm()){el.classList.add("on");localStorage.setItem("hag_n_"+key,"1");scheduleMeal(key,hour,title);}
  };
}
bindSwitch("swTrua","trua",11,"Trưa nay ăn gì?");
bindSwitch("swToi","toi",17,"Tối nay ăn gì?");
$("btnTest").onclick=async()=>{
  if(await ensurePerm()){try{
    const mt=meals[0]?meals[0].dishes.map(x=>DISHES[x][0]).join(", "):"";
    const mo=meals[1]?meals[1].dishes.map(x=>DISHES[x][0]).join(", "):"";
    new Notification("Hôm Nay Ăn Gì?",{body:"Trưa: "+mt+" · Tối: "+mo});}catch(e){}}
};
// init: time-aware
meal=mealByTime();
mealIdx=(meal==="trua")?0:1; heroIdx=0;
renderAll();
</script>

  $("rHead").style.backgroundImage=`url('${IMG[d[0]]}')`;
  $("rName").textContent=d[0];
  $("rOver").textContent=MEALN[meal]+" · "+CATS[d[1]].toUpperCase();
  $("rIngCnt").textContent=r.i.length+" món";
  $("rStepCnt").textContent=r.s.length+" bước";
  $("rIng").innerHTML=r.i.map(x=>`<div class="ing"><div class="ic">${x[0]}</div><div class="nm">${x[1]}</div><div class="qt">${x[2]}</div></div>`).join("");
  $("rSteps").innerHTML=r.s.map((s,i)=>`<div class="step"><div class="num">${i+1}</div><div class="tx">${s}</div></div>`).join("");
  $("recipeWrap").classList.add("open");
  document.body.style.overflow="hidden";
}
function closeRecipe(){$("recipeWrap").classList.remove("open");document.body.style.overflow="";}
$("rClose").onclick=closeRecipe;
$("rScrim").onclick=closeRecipe;
</script>
</body>
</html>
